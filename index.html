<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>res.bin Extractor</title>
<style>
:root{
  --bg:#0b0c0f;
  --panel:#15171b;
  --panel-2:#101216;
  --border:#292c33;
  --border-2:#30343b;
  --text:#f4f4f5;
  --muted:#858993;
  --muted-2:#9296a0;
  --accent:#f1f1f2;
  --ok:#b8e6bd;
  --warn:#e5cf9a;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f2f4; --panel:#fff; --panel-2:#f5f5f7; --border:#e2e2e6;
    --border-2:#d5d5db; --text:#111214; --muted:#6b6f78; --muted-2:#54575f;
    --accent:#18181b;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(255,255,255,0)}
html,body{
  height:100%; margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  overscroll-behavior-y:none;
}
button,input,select,label{-webkit-tap-highlight-color:rgba(255,255,255,0);font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* Fullscreen app shell: header, content (scrolls), fixed footer feel via layout */
.app{
  height:100%;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
header{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; padding:10px 14px; border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.brand{min-width:0}
h1{margin:0;font-size:16px;line-height:1.2;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{margin-top:1px;color:var(--muted);font-size:11px}
.head-btn{
  width:34px;height:34px;border-radius:9px;background:var(--panel-2);
  display:grid;place-items:center;flex:0 0 auto;
}
.head-btn svg{width:17px;height:17px;fill:currentColor}
.head-btn:hover{background:var(--border)}

main{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  padding:10px 14px 14px;
  display:flex; flex-direction:column; gap:10px;
}

.panel{
  background:var(--panel); border:1px solid var(--border);
  border-radius:14px; padding:12px;
}

.drop{
  min-height:76px; border:1.5px dashed var(--border-2); border-radius:12px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  cursor:pointer; transition:background .15s,border-color .15s; user-select:none;
}
.drop:hover,.drop.drag{background:var(--panel-2);border-color:var(--muted-2)}
.drop input{display:none}
.drop b{font-size:13px}
.drop .sub{margin-top:2px}

/* Preview: intentionally SMALL and fixed, never scales up to fill the panel */
.stage{
  display:flex; justify-content:center; align-items:center;
  background:var(--panel-2); border-radius:10px; padding:10px;
}
#canvas{
  display:block;
  width:auto; height:auto;
  max-width:220px; max-height:180px;
  image-rendering:pixelated;
  background:#fff; border-radius:4px;
  box-shadow:0 1px 0 var(--border);
}
.stage-foot{
  display:flex; justify-content:space-between; align-items:center;
  margin-top:8px; font-size:11px; color:var(--muted);
}

.info{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:6px;
}
.stat{background:var(--panel-2);border-radius:9px;padding:7px 9px;min-width:0}
.stat b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.stat span{display:block;margin-top:1px;color:var(--muted);font-size:10.5px}

/* Media / transport controls */
.media-top{display:flex;align-items:center;gap:8px}
.media-buttons{display:flex;align-items:center;gap:4px}
.media-btn{
  width:36px;height:36px;border-radius:10px;background:var(--panel-2);
  display:grid;place-items:center;transition:background .12s,transform .08s;
}
.media-btn:hover{background:var(--border)}
.media-btn:active{transform:scale(.94)}
.media-btn.primary{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--panel)}
.media-btn.primary:hover{filter:brightness(1.08)}
.media-btn svg{width:17px;height:17px;fill:currentColor}
.media-btn.primary svg{width:19px;height:19px}
.media-btn:disabled{opacity:.35;cursor:not-allowed}
.media-time{margin-left:auto;white-space:nowrap;color:var(--muted-2);font:11px ui-monospace,SFMono-Regular,Consolas,monospace}

.timeline{width:100%;height:20px;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;margin:6px 0 0}
.timeline::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:var(--border-2)}
.timeline::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border:0;border-radius:50%;background:var(--accent)}
.timeline::-moz-range-track{height:4px;border-radius:99px;background:var(--border-2)}
.timeline::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent)}

.media-bottom{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.speed{height:30px;border:1px solid var(--border-2);border-radius:8px;background:var(--panel-2);color:inherit;padding:0 7px;outline:none;font-size:12px}
.loop-toggle{
  height:30px;padding:0 10px;border:1px solid var(--border-2);border-radius:8px;
  background:var(--panel-2);font-size:12px;display:flex;align-items:center;gap:5px;
}
.loop-toggle.active{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.spacer{flex:1}
.frame-info{color:var(--muted-2);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Frame filmstrip: real thumbnails, not numbered buttons */
.frames-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.frames-head b{font-size:12px}
.frames-head span{font-size:11px;color:var(--muted)}
.frames{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 6px;scrollbar-width:thin}
.frame{
  flex:0 0 auto;width:64px;border:1.5px solid var(--border);border-radius:9px;
  overflow:hidden;cursor:pointer;background:var(--panel-2);transition:border-color .12s;
}
.frame:hover{border-color:var(--muted-2)}
.frame.active{border-color:var(--accent)}
.frame canvas{display:block;width:100%;height:52px;object-fit:contain;background:#fff}
.frame .flabel{
  display:block;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;
  color:var(--muted);text-align:center;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.frame.active .flabel{color:var(--text)}

details.log-details summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.log{
  font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;
  color:var(--muted);max-height:160px;overflow:auto;margin-top:8px;
}
.ok{color:var(--ok)}
.warn{color:var(--warn)}

/* True fullscreen mode via the Fullscreen API */
.app:fullscreen, .app:-webkit-full-screen{background:var(--bg)}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand">
    <h1>1.00 Extractor</h1>
    <div class="sub">Jieli 1.00 · keyframe-relative delta</div>
  </div>
  <button class="head-btn" id="fullscreenBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
    <svg id="fsIcon" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm10-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/></svg>
  </button>
</header>

<main>
  <div class="panel">
    <label class="drop" id="drop">
      <input id="file" type="file" accept=".bin,.res,*/*">
      <div>
        <b>Drop resource file here</b><br>
        <span class="sub">or tap to choose a file</span>
      </div>
    </label>
  </div>

  <div class="panel" id="infoPanel" hidden>
    <div class="info">
      <div class="stat"><b id="canvasSize">—</b><span>Canvas</span></div>
      <div class="stat"><b id="frameCount">—</b><span>Frames</span></div>
      <div class="stat"><b id="frameSize">—</b><span>Current frame</span></div>
      <div class="stat"><b id="frameType">—</b><span>Type</span></div>
      <div class="stat"><b id="frameBytes">—</b><span>File size</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="stage"><canvas id="canvas" width="296" height="240"></canvas></div>
    <div class="stage-foot">
      <span id="previewNote">Preview shown at fixed size — use Export for full resolution.</span>
    </div>
  </div>

  <div class="panel media">
    <div class="media-top">
      <div class="media-buttons">
        <button class="media-btn" id="first" title="First frame" aria-label="First frame">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 6l-9 6 9 6z"/></svg>
        </button>
        <button class="media-btn" id="prev" title="Previous frame" aria-label="Previous frame">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM18 6.5v11L9 12z"/></svg>
        </button>
        <button class="media-btn primary" id="play" title="Play" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>
        </button>
        <button class="media-btn" id="next" title="Next frame" aria-label="Next frame">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 6.5l9 5.5-9 5.5z"/></svg>
        </button>
        <button class="media-btn" id="last" title="Last frame" aria-label="Last frame">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 6l9 6-9 6z"/></svg>
        </button>
      </div>
      <div class="media-time" id="mediaTime">0 / 0</div>
    </div>

    <input id="slider" class="timeline" type="range" min="0" max="0" value="0" step="1" aria-label="Frame position">

    <div class="media-bottom">
      <select id="speed" class="speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
      <button class="loop-toggle active" id="loop" aria-pressed="true" title="Loop playback">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        Loop
      </button>
      <div class="spacer"></div>
      <div class="frame-info" id="frameLabel">No file loaded</div>
      <button class="media-btn" id="png" title="Export current frame as PNG" aria-label="Export current frame as PNG">
        <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2h14v-2"/></svg>
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="frames-head">
      <b>Frames</b>
      <span id="framesHint">Tap a thumbnail to jump</span>
    </div>
    <div class="frames" id="frames"></div>
  </div>

  <div class="panel">
    <details class="log-details" open>
      <summary>Log</summary>
      <div class="log" id="log"></div>
    </details>
  </div>
</main>
</div>

<script>
"use strict";

/*
  JIELI 1.00 RESOURCE FORMAT

  Header:
    00 char[4]  "1.00"
    04 u16      width
    06 u16      height
    08 u16      frame count
    0A u16      delay
    0C u32      reserved

  Frame record = 28 bytes:

    +00 u16 frame width
    +02 u16 frame height
    +04 u16 frame number
    +06 u16 flags
    +08 u32 metadata
    +0C u32 payload offset
    +10 u32 payload length
    +14 u32 decoded byte count
    +18 u32 reserved

  Types:
    0x0B = KEY
    0x0F = delta + palette
    0x0E = delta without palette

  Delta frames are relative to the
  most recent KEY frame.

  Delta 0xFF = unchanged.

  Smaller delta rectangles are right aligned.
*/

const FRAME_BASE = 0x10;
const FRAME_SIZE = 28;

let resource = null;
let fileBytes = null;

let decodedFrames = [];
let currentFrame = 0;

let keyframeBase = null;
let keyframePalette = null;

let playing = false;
let playTimer = 0;

const $ = id => document.getElementById(id);

const canvas = $("canvas");
const ctx = canvas.getContext("2d");

function u16(a,o){
  return (a[o] | (a[o + 1] << 8)) >>> 0;
}

function u32(a,o){
  return (a[o] | (a[o + 1] << 8) | (a[o + 2] << 16) | (a[o + 3] * 0x1000000)) >>> 0;
}

function log(text,cls=""){
  const el = document.createElement("div");
  el.textContent = text;
  if(cls) el.className = cls;
  $("log").appendChild(el);
  el.scrollIntoView({block:"nearest"});
}

function clearLog(){
  $("log").textContent = "";
}

function readHeader(bytes){
  if(bytes.length < 16){
    throw new Error("File is smaller than the 16-byte header.");
  }
  const magic = new TextDecoder().decode(bytes.subarray(0,4));
  if(magic !== "1.00"){
    throw new Error(`Unsupported resource header: ${JSON.stringify(magic)}`);
  }
  return {
    width:u16(bytes,0x04),
    height:u16(bytes,0x06),
    frameCount:u16(bytes,0x08),
    delay:u16(bytes,0x0A),
    reserved:u32(bytes,0x0C)
  };
}

function readFrameRecord(bytes,index){
  const o = FRAME_BASE + index * FRAME_SIZE;
  if(o + FRAME_SIZE > bytes.length){
    throw new Error(`Frame ${index + 1}: record exceeds file.`);
  }
  return {
    width:u16(bytes,o),
    height:u16(bytes,o+2),
    number:u16(bytes,o+4),
    flags:u16(bytes,o+6),
    meta:u32(bytes,o+8),
    payloadOffset:u32(bytes,o+12),
    payloadLength:u32(bytes,o+16),
    decodedBytes:u32(bytes,o+20),
    reserved:u32(bytes,o+24)
  };
}

function getType(meta){
  return (meta >>> 16) & 0xFF;
}

function typeName(type){
  if(type === 0x0B) return "KEY";
  if(type === 0x0F) return "dF";
  if(type === 0x0E) return "dE";
  return "0x" + type.toString(16).padStart(2,"0").toUpperCase();
}

function decodeRow(blob,start,length,width){
  const end = start + length;
  let ip = start;
  let op = 0;
  const out = new Uint8Array(width);

  while(ip < end && op < width){
    const c = blob[ip++];
    const count = c & 0x7F;
    if(count === 0) continue;

    if(c & 0x80){
      if(ip >= end){
        throw new Error("RLE repeat is missing its value.");
      }
      const value = blob[ip++];
      if(op + count > width){
        throw new Error("RLE repeat exceeds row width.");
      }
      out.fill(value,op,op+count);
      op += count;
    }else{
      if(ip + count > end){
        throw new Error("RLE literal exceeds compressed row.");
      }
      if(op + count > width){
        throw new Error("RLE literal exceeds row width.");
      }
      out.set(blob.subarray(ip,ip+count),op);
      ip += count;
      op += count;
    }
  }

  if(op !== width){
    throw new Error(`Row decoded ${op}/${width} pixels.`);
  }

  return out;
}

function readPalette(blob){
  if(blob.length < 0x400){
    throw new Error("Palette block is incomplete.");
  }
  const palette = new Uint8Array(1024);
  palette.set(blob.subarray(0,0x400));
  return palette;
}

function decodeFrame(bytes,rec,baseCanvas,basePalette){
  const type = getType(rec.meta);
  const isKey = type === 0x0B;
  const hasPalette = type === 0x0B || type === 0x0F;

  const start = rec.payloadOffset;
  const end = start + rec.payloadLength;

  if(start < 0 || end > bytes.length){
    throw new Error("Frame payload outside file.");
  }

  const blob = bytes.subarray(start,end);
  const fw = rec.width;
  const fh = rec.height;

  if(fw < 1 || fh < 1 || fw > resource.width || fh > resource.height){
    throw new Error(`Invalid frame dimensions ${fw}×${fh}.`);
  }

  let palette;
  if(hasPalette){
    palette = readPalette(blob);
  }else{
    if(!basePalette){
      throw new Error("0x0E delta encountered before a keyframe.");
    }
    palette = new Uint8Array(basePalette);
  }

  /*
    IMPORTANT:
    Deltas are based on the MOST RECENT KEYFRAME,
    never the previous delta.
  */
  let indexed;
  if(isKey){
    indexed = new Uint8Array(resource.width * resource.height);
  }else{
    if(!baseCanvas){
      throw new Error("Delta frame has no keyframe base.");
    }
    indexed = new Uint8Array(baseCanvas);
  }

  const xOffset = resource.width - fw;
  const yOffset = 0;

  const rowTableBase = type === 0x0E ? 0 : 0x400;
  const rowTableEnd = rowTableBase + fh * 4;

  if(rowTableEnd > blob.length){
    throw new Error("Frame row table is incomplete.");
  }

  for(let y=0;y<fh;y++){
    const packed = u32(blob, rowTableBase + y * 4);
    const rowOffset = packed & 0x1FFFFF;
    const rowLength = packed >>> 21;
    const rowStart = rowTableBase + rowOffset;
    const rowEnd = rowStart + rowLength;

    if(rowStart < rowTableEnd || rowEnd > blob.length){
      throw new Error(`Frame ${rec.number}, row ${y}: invalid range.`);
    }

    const row = decodeRow(blob, rowStart, rowLength, fw);
    const dst = (y + yOffset) * resource.width + xOffset;

    for(let x=0;x<fw;x++){
      const value = row[x];
      if(!isKey && value === 0xFF){
        continue;
      }
      indexed[dst+x] = value;
    }
  }

  return {
    indexed,
    palette,
    width:resource.width,
    height:resource.height,
    frameWidth:fw,
    frameHeight:fh,
    x:xOffset,
    y:yOffset,
    type,
    typeName:typeName(type),
    number:rec.number,
    delay:rec.delay || resource.delay,
    payloadOffset:rec.payloadOffset,
    payloadLength:rec.payloadLength
  };
}

function indexedToImage(frame){
  const w = resource.width;
  const h = resource.height;
  const rgba = new Uint8ClampedArray(w * h * 4);
  const palette = frame.palette;
  const indexed = frame.indexed;

  for(let i=0;i<indexed.length;i++){
    const p = indexed[i] * 4;
    rgba[i*4] = palette[p+1];
    rgba[i*4+1] = palette[p+2];
    rgba[i*4+2] = palette[p+3];
    rgba[i*4+3] = palette[p];
  }

  return new ImageData(rgba, w, h);
}

/* ---------------- UI layer ---------------- */

function render(index){
  if(!decodedFrames.length) return;

  index = Math.max(0, Math.min(index, decodedFrames.length-1));
  currentFrame = index;

  const frame = decodedFrames[index];
  ctx.putImageData(indexedToImage(frame), 0, 0);

  $("slider").value = index;
  $("frameSize").textContent = `${frame.frameWidth}×${frame.frameHeight}`;
  $("frameType").textContent = frame.typeName;
  $("frameLabel").textContent = `Frame ${index+1} · ${frame.frameWidth}×${frame.frameHeight} · ${frame.typeName}`;
  $("mediaTime").textContent = `${index+1} / ${decodedFrames.length}`;

  document.querySelectorAll(".frame").forEach((el,i)=>{
    el.classList.toggle("active", i === index);
    if(i === index){
      el.scrollIntoView({inline:"nearest", block:"nearest", behavior:"smooth"});
    }
  });
}

function buildFrameThumbnails(){
  const box = $("frames");
  box.textContent = "";

  const tw = 64, th = 52;

  decodedFrames.forEach((frame,index)=>{
    const b = document.createElement("button");
    b.className = "frame";
    b.title = `Frame ${index+1}: ${frame.frameWidth}×${frame.frameHeight} ${frame.typeName}`;

    const thumbCanvas = document.createElement("canvas");
    thumbCanvas.width = tw;
    thumbCanvas.height = th;
    const tctx = thumbCanvas.getContext("2d");

    // Render the full decoded frame off-screen at native size, then
    // scale it down into the small thumbnail canvas.
    const full = document.createElement("canvas");
    full.width = resource.width;
    full.height = resource.height;
    full.getContext("2d").putImageData(indexedToImage(frame), 0, 0);

    const scale = Math.min(tw / resource.width, th / resource.height);
    const dw = resource.width * scale;
    const dh = resource.height * scale;
    tctx.fillStyle = "#fff";
    tctx.fillRect(0,0,tw,th);
    tctx.drawImage(full, (tw-dw)/2, (th-dh)/2, dw, dh);

    const label = document.createElement("span");
    label.className = "flabel";
    label.textContent = `${index+1} · ${frame.typeName}`;

    b.appendChild(thumbCanvas);
    b.appendChild(label);

    b.onclick = ()=>{
      stopPlayback();
      render(index);
    };

    box.appendChild(b);
  });
}

async function loadFile(file){
  clearLog();

  try{
    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    fileBytes = bytes;

    resource = readHeader(bytes);
    decodedFrames = [];
    keyframeBase = null;
    keyframePalette = null;

    log(file.name,"ok");
    log(`Canvas: ${resource.width}×${resource.height}`);
    log(`Frames: ${resource.frameCount}`);

    for(let i=0;i<resource.frameCount;i++){
      const rec = readFrameRecord(bytes,i);
      const type = getType(rec.meta);
      const frame = decodeFrame(bytes, rec, keyframeBase, keyframePalette);

      decodedFrames.push(frame);

      if(type === 0x0B){
        keyframeBase = new Uint8Array(frame.indexed);
        keyframePalette = new Uint8Array(frame.palette);
      }

      log(`F${i+1}: ${frame.frameWidth}×${frame.frameHeight} ${frame.typeName} → x=${frame.x}, y=${frame.y}`);
    }

    canvas.width = resource.width;
    canvas.height = resource.height;

    $("canvasSize").textContent = `${resource.width}×${resource.height}`;
    $("frameCount").textContent = resource.frameCount;
    $("frameBytes").textContent = `${(bytes.length/1048576).toFixed(2)} MB`;
    $("slider").max = Math.max(0,decodedFrames.length-1);
    $("infoPanel").hidden = false;

    buildFrameThumbnails();
    render(0);

    log("Decoded successfully.","ok");

  }catch(error){
    decodedFrames = [];
    log("Decode failed: " + (error?.message || String(error)), "warn");
  }
}

function stopPlayback(){
  playing = false;
  clearTimeout(playTimer);
  $("playIcon").innerHTML = '<path d="M8 5.5v13l10-6.5z"/>';
  $("play").title = "Play";
  $("play").setAttribute("aria-label","Play");
}

function startPlayback(){
  if(!decodedFrames.length) return;
  playing = true;
  $("playIcon").innerHTML = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
  $("play").title = "Pause";
  $("play").setAttribute("aria-label","Pause");

  const tick = ()=>{
    if(!playing) return;

    const frame = decodedFrames[currentFrame];
    const atEnd = currentFrame >= decodedFrames.length - 1;
    const loop = $("loop").classList.contains("active");

    if(atEnd && !loop){
      stopPlayback();
      return;
    }

    render((currentFrame+1) % decodedFrames.length);

    const speed = Number($("speed").value) || 1;
    playTimer = setTimeout(tick, Math.max(1, (frame.delay || resource.delay || 100) / speed));
  };

  tick();
}

$("drop").onclick = ()=>{ $("file").click(); };

$("file").onchange = event=>{
  const file = event.target.files?.[0];
  if(file) loadFile(file);
};

$("drop").ondragover = event=>{
  event.preventDefault();
  $("drop").classList.add("drag");
};

$("drop").ondragleave = ()=>{ $("drop").classList.remove("drag"); };

$("drop").ondrop = event=>{
  event.preventDefault();
  $("drop").classList.remove("drag");
  const file = event.dataTransfer.files?.[0];
  if(file) loadFile(file);
};

$("play").onclick = ()=>{
  if(playing) stopPlayback();
  else startPlayback();
};

$("first").onclick = ()=>{
  stopPlayback();
  if(decodedFrames.length) render(0);
};

$("last").onclick = ()=>{
  stopPlayback();
  if(decodedFrames.length) render(decodedFrames.length-1);
};

$("prev").onclick = ()=>{
  stopPlayback();
  if(!decodedFrames.length) return;
  render((currentFrame - 1 + decodedFrames.length) % decodedFrames.length);
};

$("next").onclick = ()=>{
  stopPlayback();
  if(!decodedFrames.length) return;
  render((currentFrame+1) % decodedFrames.length);
};

$("slider").oninput = event=>{
  stopPlayback();
  render(Number(event.target.value));
};

$("loop").onclick = ()=>{
  const el = $("loop");
  const active = !el.classList.contains("active");
  el.classList.toggle("active", active);
  el.setAttribute("aria-pressed", String(active));
};

$("png").onclick = ()=>{
  if(!decodedFrames.length) return;
  canvas.toBlob(blob=>{
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `jieli-frame-${String(currentFrame+1).padStart(3,"0")}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }, "image/png");
};

/* Keyboard shortcuts: space = play/pause, arrows = step frames */
document.addEventListener("keydown", e=>{
  if(!decodedFrames.length) return;
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;

  if(e.code === "Space"){
    e.preventDefault();
    $("play").click();
  }else if(e.code === "ArrowRight"){
    $("next").click();
  }else if(e.code === "ArrowLeft"){
    $("prev").click();
  }
});

/* Fullscreen toggle for the whole app shell */
const appEl = $("app");
const fsBtn = $("fullscreenBtn");
const fsIcon = $("fsIcon");

const ICON_ENTER = '<path d="M4 9V4h5v2H6v3H4zm10-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/>';
const ICON_EXIT  = '<path d="M9 4v3H6v2H4V4h5zm11 5V6h-3V4h5v5h-2zM4 15h2v3h3v2H4v-5zm16 0v5h-5v-2h3v-3h2z"/>';

function updateFsIcon(){
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  fsIcon.innerHTML = isFs ? ICON_EXIT : ICON_ENTER;
  fsBtn.title = isFs ? "Exit fullscreen" : "Enter fullscreen";
}

fsBtn.onclick = ()=>{
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(!isFs){
    (appEl.requestFullscreen || appEl.webkitRequestFullscreen)?.call(appEl);
  }else{
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  }
};

document.addEventListener("fullscreenchange", updateFsIcon);
document.addEventListener("webkitfullscreenchange", updateFsIcon);
updateFsIcon();
</script>
</body>
</html>
